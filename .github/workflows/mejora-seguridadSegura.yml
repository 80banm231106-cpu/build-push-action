name: 1. Demostración Segura (0 vulnerabilidades)

on:
  workflow_dispatch: # Botón manual

# Permisos necesarios para publicar en GitHub Packages
permissions:
  contents: read
  packages: write

jobs:
  escaneo-seguridad:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@v4

      - name: 2. Preparar Docker
        uses: docker/setup-buildx-action@v3

      # PASO CLAVE: Iniciar sesión en el registro de GitHub de forma segura
      - name: 2.5 Iniciar sesión en GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Construir y Publicar imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./test/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/app-segura:latest

      - name: 4. Escáner Trivy (Debe pasar en Verde)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/app-segura:latest
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'